<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de Gestión Veterinaria</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
  <div class="login-container">
    <!-- Panel Izquierdo - Formulario -->
    <div class="login-form-panel">
      <div class="form-wrapper">
        <div class="logo-section">
          <div class="logo-icon">🐾</div>
          <h1>SIVET</h1>
          <p>Sistema de Gestión Veterinaria</p>
        </div>

        <!-- agregue id= login form-->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input type="email" id="email" placeholder="correo@ejemplo.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" placeholder="Ingresa tu contraseña" />
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" />
              <span>Recordarme</span>
            </label>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
      </div>
    </div>

    <!-- Panel Derecho - Visual Veterinaria -->
    <div class="visual-panel">
      <div class="visual-content">
        <div class="vet-illustration">
          <div class="vet-icon">🏥</div>
        </div>
        <h2>Bienvenido a SIVET</h2>
        <p>
          Tu solución completa para la gestión profesional de clínicas
          veterinarias
        </p>

        <div class="features">
          <div class="feature-item">
            <div class="feature-icon">📅</div>
            <span class="feature-text">Gestión de Citas</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon">🐕</div>
            <span class="feature-text">Registro de Mascotas</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon">💊</div>
            <span class="feature-text">Control de Inventario</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- incorpore script -->
  <script src="assets/js/login.js"></script>

</body>

</html>
